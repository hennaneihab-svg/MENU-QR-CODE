<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu QR Code</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="https://unpkg.com/@studio-freight/lenis@1.0.42/dist/lenis.min.js"></script>
</head>
<body>
  
  <div id="entry-screen">
    <div class="entry-content">
      <h1 class="entry-title">
        <span class="mask-wrap"><span class="mask-text" id="entry-name">Napoli Forno</span></span>
      </h1>
      <div class="entry-btn-wrap">
        <button id="enter-btn">Voir le menu</button>
      </div>
    </div>
  </div>

  <div id="fullscreen-menu" class="hidden">
    <div class="overlay-bg"></div>
    <div class="overlay-content">
      <button id="close-menu-btn">Fermer</button>
      <nav id="category-nav"></nav>
    </div>
  </div>

  <header id="main-header" class="hidden-initially">
    <div class="header-inner">
      <div id="restaurant-name-logo">Menu</div>
      <div class="header-controls">
        <nav class="lang-segmented-control" id="lang-segment">
          <div class="lang-indicator"></div>
          <button data-lang="fr" class="active">FR</button>
          <button data-lang="en">EN</button>
          <button data-lang="ar">AR</button>
        </nav>
        <button id="menu-toggle-btn">Menu</button>
      </div>
    </div>
  </header>

  <div class="demo-controls hidden-initially">
    <label>Demo: Changer de restaurant</label>
    <select id="restaurant-select">
      <option value="napoli-forno">Napoli Forno</option>
      <option value="urban-grill">Urban Grill</option>
      <option value="dar-el-bey">Dar El Bey</option>
      <option value="sakura-bar">Sakura Bar</option>
    </select>
  </div>

  <div id="app" class="hidden-initially">
    <div id="special-container"></div>
    <div id="menu-container" class="skeleton-container">
      <div class="skeleton-item"></div>
      <div class="skeleton-item"></div>
      <div class="skeleton-item"></div>
    </div>
    <div id="cart-bar" class="hidden">
      <span id="cart-total-text">Total: 0 DA</span>
      <button id="checkout-btn">Commander</button>
    </div>
    <div id="order-tracking" class="modal hidden">
      <div class="modal-content">
        <h2 id="tracking-title">Commande</h2>
        <div class="tracking-steps">
          <div class="step" id="step-1">1. Recue</div>
          <div class="step" id="step-2">2. En preparation</div>
          <div class="step" id="step-3">3. Prete</div>
          <div class="step" id="step-4">4. Servie</div>
        </div>
      </div>
    </div>
  </div>

  <footer id="main-footer" class="hidden-initially fade-in-up">
    <div class="footer-inner">
      <div class="footer-col">
        <h3 id="footer-restaurant-name">Nom du Restaurant</h3>
        <p id="footer-address">123 Boulevard Fictif, Alger, Algerie</p>
      </div>
      <div class="footer-col">
        <h3 class="footer-title">Horaires</h3>
        <p>Lun - Dim : 11h30 - 23h30</p>
      </div>
      <div class="footer-col">
        <h3 class="footer-title">Legales</h3>
        <a href="CREDITS.md">Credits photos</a>
        <span class="demo-badge">Mode Demo</span>
      </div>
    </div>
  </footer>

  <script src="data/menus.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
